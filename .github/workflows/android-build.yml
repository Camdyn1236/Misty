
name: MistyTemp Dual Unity Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - unity21_2021.3
          - unity22_2022.3
        abi:
          - arm64-v8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="${{ matrix.variant }}"
          PROJECT_DIR=""

          # Check whether the project is already extracted.
          if [[ -f "${VARIANT}/gradlew" && -d "${VARIANT}/app" ]]; then
            PROJECT_DIR="${VARIANT}"

          elif [[ -f "gradlew" && -d "app" ]]; then
            PROJECT_DIR="."

          else
            # Look for the exact ZIP name first.
            ZIP_PATH="./MistyTemp_AntiQuit_DualUnity.zip"

            # Fall back to any MistyTemp ZIP in the repository.
            if [[ ! -f "${ZIP_PATH}" ]]; then
              ZIP_PATH="$(find . -maxdepth 4 -type f \
                -iname 'MistyTemp*.zip' -print -quit)"
            fi

            if [[ -z "${ZIP_PATH}" || ! -f "${ZIP_PATH}" ]]; then
              echo "::error::MistyTemp ZIP was not found."
              echo "Repository contents:"
              find . -maxdepth 4 -type f | sort | head -300
              exit 1
            fi

            echo "Found ZIP: ${ZIP_PATH}"

            mkdir -p .build-source

            # Python supports the LZMA compression used by the updated ZIP.
            python3 - "${ZIP_PATH}" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]

          try:
              with zipfile.ZipFile(zip_path, "r") as archive:
                  bad_file = archive.testzip()
                  if bad_file:
                      raise RuntimeError(f"Corrupt ZIP entry: {bad_file}")

                  archive.extractall(".build-source")

          except Exception as error:
              print(f"ZIP extraction failed: {error}", file=sys.stderr)
              sys.exit(1)

          print("ZIP extracted and integrity checked.")
          PY

            # Confirm the expected Unity project exists.
            if [[ -f ".build-source/${VARIANT}/gradlew" && \
                  -d ".build-source/${VARIANT}/app" ]]; then
              PROJECT_DIR=".build-source/${VARIANT}"
            else
              echo "::error::Could not find ${VARIANT} inside the extracted ZIP."
              echo "Found Gradle projects:"
              find .build-source -maxdepth 5 -type f \
                \( -name gradlew -o -name build.gradle \) -print
              exit 1
            fi
          fi

          if [[ ! -f "${PROJECT_DIR}/app/build.gradle" ]]; then
            echo "::error::app/build.gradle is missing."
            exit 1
          fi

          if [[ ! -f "${PROJECT_DIR}/gradlew" ]]; then
            echo "::error::Gradle wrapper is missing."
            exit 1
          fi

          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "Building: ${PROJECT_DIR}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Configure Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}
          EOF

          ./gradlew --version

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.injected.build.abi="${{ matrix.abi }}"

      - name: Verify APK output
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [[ ! -d "${APK_DIR}" ]]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          find "${APK_DIR}" -type f -name "*.apk" -print

          if ! find "${APK_DIR}" -type f -name "*.apk" | grep -q .; then
            echo "::error::No APK was generated."
            exit 1
          fi

      - name: Upload APK and native libraries
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.variant }}-${{ matrix.abi }}
          if-no-files-found: warn
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cxx/Debug/**/obj/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cmake/debug/obj/${{ matrix.abi }}/*.so
