name: Android NDK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS: "34.0.0"
  PLATFORM: "android-34"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (non-interactive)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Accept all SDK licenses (non-interactive)
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451beabcad4263dfc32bed5f92a5f\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "e9acab5b5fbb560a72cfaecce8946896ff6a2c32\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo -e "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "8403addf88ab4874007e1c1e80a0025bf2550a37\n" > "$ANDROID_HOME/licenses/intel-android-sysimage-license"

      - name: Install NDK / CMake / platform
        run: |
          set -e
          sdkmanager --install \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "platforms;${PLATFORM}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}"
          } > local.properties
          cp local.properties app/local.properties 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build native + APK (debug)
        run: |
          ./gradlew assembleDebug --stacktrace \
            -Pandroid.injected.build.abi=${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/intermediates/cxx/**/*.so
            app/build/intermediates/cmake/**/*.so
          if-no-files-found: warn
