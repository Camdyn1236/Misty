name: MistyTemp Dual Unity Native Library Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  build:
    name: Build ${{ matrix.variant }} Native Library
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant:
          - unity21_2021.3
          - unity22_2022.3
        abi:
          - arm64-v8a

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Locate and extract ZIP
      - name: Locate and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="${{ matrix.variant }}"
          PROJECT_DIR=""

          if [[ -f "${VARIANT}/gradlew" && -d "${VARIANT}/app" ]]; then
            PROJECT_DIR="${VARIANT}"

          elif [[ -f "gradlew" && -d "app" ]]; then
            PROJECT_DIR="."

          else
            ZIP_PATH="./MistyTemp_AntiQuit_DualUnity.zip"

            if [[ ! -f "${ZIP_PATH}" ]]; then
              ZIP_PATH="$(find . -maxdepth 5 -type f \
                -iname 'MistyTemp*.zip' -print -quit)"
            fi

            if [[ -z "${ZIP_PATH}" || ! -f "${ZIP_PATH}" ]]; then
              echo "::error::Project ZIP not found."
              find . -maxdepth 5 -type f | sort | head -300
              exit 1
            fi

            echo "Found ZIP: ${ZIP_PATH}"
            mkdir -p .build-source

            # Supports both ordinary ZIP and LZMA compression.
            python3 - "${ZIP_PATH}" <<'PY'
          import sys
          import zipfile

          try:
              with zipfile.ZipFile(sys.argv[1], "r") as archive:
                  bad_file = archive.testzip()

                  if bad_file:
                      raise RuntimeError(f"Corrupt ZIP entry: {bad_file}")

                  archive.extractall(".build-source")

              print("ZIP integrity verified.")
              print("Extraction completed.")

          except Exception as error:
              print(f"ZIP extraction failed: {error}", file=sys.stderr)
              sys.exit(1)
          PY

            if [[ -f ".build-source/${VARIANT}/gradlew" && \
                  -d ".build-source/${VARIANT}/app" ]]; then
              PROJECT_DIR=".build-source/${VARIANT}"
            else
              echo "::error::Unity project ${VARIANT} not found."
              find .build-source -maxdepth 5 \
                \( -name gradlew -o -name build.gradle \) -print
              exit 1
            fi
          fi

          test -f "${PROJECT_DIR}/gradlew"
          test -f "${PROJECT_DIR}/app/build.gradle"
          test -f "${PROJECT_DIR}/app/src/main/cpp/CMakeLists.txt"

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Selected project: ${PROJECT_DIR}"

      # 3. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 5. Install native build dependencies
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "Android SDK installation complete."

      # 6. Configure Gradle
      - name: Configure Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_NDK_HOME}
          EOF

          ./gradlew --version

      # 7. Compile native C++ library only
      - name: Build MistyTemp native library
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building native target MistyTemp"
          echo "Unity variant: ${{ matrix.variant }}"
          echo "Android ABI: ${{ matrix.abi }}"

          ./gradlew :app:externalNativeBuildDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.injected.build.abi="${{ matrix.abi }}"

      # 8. Find and stage the compiled .so
      - name: Collect native library
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ABI="${{ matrix.abi }}"
          LIBRARY_NAME="libMistyTemp.so"

          mkdir -p native-artifacts

          echo "Searching for ${LIBRARY_NAME}..."

          mapfile -t LIBRARIES < <(
            find app/build -type f \
              -name "${LIBRARY_NAME}" \
              -path "*/${ABI}/*"
          )

          if [[ ${#LIBRARIES[@]} -eq 0 ]]; then
            echo "::error::${LIBRARY_NAME} was not generated for ${ABI}."

            echo "All generated shared libraries:"
            find app/build -type f -name "*.so" -print || true

            echo "CMake build directories:"
            find app/build -type d \
              \( -name "cmake" -o -name "cxx" \) -print || true

            exit 1
          fi

          if [[ ${#LIBRARIES[@]} -gt 1 ]]; then
            echo "Multiple matching libraries found:"
            printf '%s\n' "${LIBRARIES[@]}"
          fi

          SOURCE_LIBRARY="${LIBRARIES[0]}"

          cp "${SOURCE_LIBRARY}" "native-artifacts/${LIBRARY_NAME}"

          echo "Native library collected:"
          ls -lh "native-artifacts/${LIBRARY_NAME}"
          file "native-artifacts/${LIBRARY_NAME}"

          echo "Library architecture:"
          readelf -h "native-artifacts/${LIBRARY_NAME}" | grep -E 'Class:|Machine:'

      # 9. Upload only the native library
      - name: Upload compiled SO
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.variant }}-${{ matrix.abi }}-SO
          path: ${{ steps.project.outputs.project_dir }}/native-artifacts/libMistyTemp.so
          if-no-files-found: error
          retention-days: 14
