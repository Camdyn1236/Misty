name: MistyTemp Dual Unity Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.abi }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - unity21_2021.3
          - unity22_2022.3
        abi:
          - arm64-v8a

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Locate and extract ZIP
      - name: Locate and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="${{ matrix.variant }}"
          PROJECT_DIR=""

          echo "Looking for project: ${VARIANT}"

          # Already extracted into repository
          if [[ -f "${VARIANT}/gradlew" && -d "${VARIANT}/app" ]]; then
            PROJECT_DIR="${VARIANT}"

          # Project is repository root
          elif [[ -f "gradlew" && -d "app" ]]; then
            PROJECT_DIR="."

          else
            ZIP_PATH="./MistyTemp_AntiQuit_DualUnity.zip"

            # Find ZIP if filename or location differs
            if [[ ! -f "${ZIP_PATH}" ]]; then
              ZIP_PATH="$(find . -maxdepth 5 -type f \
                -iname 'MistyTemp*.zip' -print -quit)"
            fi

            if [[ -z "${ZIP_PATH}" || ! -f "${ZIP_PATH}" ]]; then
              echo "::error::Project ZIP not found."
              find . -maxdepth 5 -type f | sort | head -300
              exit 1
            fi

            echo "ZIP found: ${ZIP_PATH}"

            mkdir -p .build-source

            # Python extraction supports LZMA-compressed ZIP files.
            python3 - "${ZIP_PATH}" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]

          try:
              with zipfile.ZipFile(zip_path, "r") as archive:
                  bad_file = archive.testzip()

                  if bad_file:
                      raise RuntimeError(
                          f"Corrupt ZIP entry: {bad_file}"
                      )

                  archive.extractall(".build-source")

              print("ZIP integrity verified.")
              print("ZIP extraction completed.")

          except Exception as error:
              print(f"Extraction failed: {error}", file=sys.stderr)
              sys.exit(1)
          PY

            # Find requested Unity project
            if [[ -f ".build-source/${VARIANT}/gradlew" && \
                  -d ".build-source/${VARIANT}/app" ]]; then

              PROJECT_DIR=".build-source/${VARIANT}"

            else
              echo "::error::${VARIANT} was not found in ZIP."

              find .build-source -maxdepth 5 \
                \( -name gradlew -o -name build.gradle \) -print

              exit 1
            fi
          fi

          # Verify project structure
          test -f "${PROJECT_DIR}/gradlew"
          test -f "${PROJECT_DIR}/app/build.gradle"

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"

          echo "Selected project: ${PROJECT_DIR}"

      # 3. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 4. Install Android SDK command-line tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 5. Install required SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android SDK components..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "SDK installation completed."

      # 6. Configure Gradle
      - name: Configure Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_NDK_HOME}
          EOF

          ./gradlew --version

      # 7. Compile Android APK
      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building ${{ matrix.variant }}"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.injected.build.abi="${{ matrix.abi }}"

      # 8. Verify APK
      - name: Verify APK output
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [[ ! -d "${APK_DIR}" ]]; then
            echo "::error::APK output directory missing."
            exit 1
          fi

          APK_COUNT=$(find "${APK_DIR}" -type f -name "*.apk" | wc -l)

          if [[ "${APK_COUNT}" -eq 0 ]]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "Generated APK files:"
          find "${APK_DIR}" -type f -name "*.apk" -print

      # 9. Upload APK and native libraries
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.variant }}-${{ matrix.abi }}
          if-no-files-found: warn
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cxx/Debug/**/obj/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cmake/debug/obj/${{ matrix.abi }}/*.so
