name: MistyTemp Dual Unity Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - unity21_2021.3
          - unity22_2022.3
        abi:
          - arm64-v8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="${{ matrix.variant }}"
          PROJECT_DIR=""

          # Case 1: both Unity variant folders were committed directly.
          if [[ -f "${VARIANT}/gradlew" && -d "${VARIANT}/app" ]]; then
            PROJECT_DIR="${VARIANT}"
          # Case 2: this variant is itself the repository root.
          elif [[ -f "gradlew" && -d "app" ]]; then
            PROJECT_DIR="."
          else
            # Case 3: the repository contains the uploaded dual-Unity ZIP.
            ZIP_PATH="$(find . -maxdepth 3 -type f \
              \( -iname 'MistyTemp_AntiQuit_DualUnity.zip' -o -iname 'MistyTemp*.zip' \) \
              -print -quit)"

            if [[ -z "${ZIP_PATH}" ]]; then
              echo "::error::Could not find ${VARIANT}/gradlew, root gradlew, or MistyTemp*.zip."
              echo "Repository files:"
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi

            echo "Extracting: ${ZIP_PATH}"
            mkdir -p .build-source
            unzip -oq "${ZIP_PATH}" -d .build-source

            if [[ -f ".build-source/${VARIANT}/gradlew" && -d ".build-source/${VARIANT}/app" ]]; then
              PROJECT_DIR=".build-source/${VARIANT}"
            else
              echo "::error::ZIP does not contain the expected ${VARIANT}/gradlew and ${VARIANT}/app layout."
              find .build-source -maxdepth 4 -type f \( -name gradlew -o -name build.gradle \) -print
              exit 1
            fi
          fi

          echo "project_dir=${PROJECT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"
          echo "Building project directory: ${PROJECT_DIR}"
          test -f "${PROJECT_DIR}/gradlew"
          test -d "${PROJECT_DIR}/app"
          test -f "${PROJECT_DIR}/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ steps.project.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties
            ${{ steps.project.outputs.project_dir }}/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"

      - name: Configure Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}"
          } > local.properties
          ./gradlew --version

      - name: Build debug APK and native library
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pandroid.injected.build.abi="${{ matrix.abi }}"

      - name: Upload APK and native libraries
        uses: actions/upload-artifact@v4
        with:
          name: mistytemp-${{ matrix.variant }}-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/stripped_native_libs/debug/out/lib/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cxx/Debug/**/obj/${{ matrix.abi }}/*.so
            ${{ steps.project.outputs.project_dir }}/app/build/intermediates/cmake/debug/obj/${{ matrix.abi }}/*.so
